id = "andre.windows-paths"
name = "Windows Paths"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Abre links file:// (OSC 8) no app padrão do Windows"
platforms = ["linux"]

[[actions]]
id = "open"
title = "Abrir path no Windows"
contexts = ["pane"]
command = ["python3", "open_path.py"]

[[link_handlers]]
id = "windows-path"
title = "Abrir no Windows"
pattern = '(?i)^file://'
action = "open"
